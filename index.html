<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7FAFC">
<title>Генератор тем для речи — говори·ясно</title>
<meta name="description" content="Крути рулетку и получай тему для речи: случайные темы, истории, аргументация, питч.">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  /* Lora (serif) and Excalifont (handwritten). Drop the files into a
     fonts/ folder next to index.html; until then the fallbacks
     (PT Serif / Caveat) are used, so nothing breaks. */
  @font-face{
    font-family:'Lora'; font-style:normal; font-weight:400; font-display:swap;
    src: local('Lora'),
         url('fonts/Lora.ttf') format('truetype');
  }
  @font-face{
    font-family:'Onest'; font-style:normal; font-weight:400; font-display:swap;
    src: local('Onest'),
         url('fonts/Onest-Light.ttf') format('truetype');
  }
    @font-face{
    font-family:'Caveat'; font-style:normal; font-weight:100; font-display:swap;
    src: local('Caveat'),
         url('fonts/Caveat.ttf') format('truetype');
  }
  :root{
    --font-sans: 'Lora', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-serif: 'Onest', 'PT Serif', Georgia, 'Times New Roman', serif;
    --font-hand: 'Caveat', 'Comic Sans MS', cursive;
    --bg: #F7FAFC;
    --bg-panel: #FFFFFF;
    --bg-soft: #EEF3F7;
    --ink: #16222E;
    --ink-soft: #5C6B77;
    --ink-faint: #93A1AC;
    --line: #D5DEE2;
    --accent: #0077B3;
    --accent-soft: #E4F1F8;
    --warm: #C6853E;
    --warm-soft: #FAF0E1;
    --good: #2F8F5B;
    --good-soft: #E4F5EB;
    --caution: #7A5CB8;
    --caution-soft: #EEE9F7;
    --danger: #C6483E;
    --danger-soft: #FBE9E7;
    --radius-s: 3px;
    --radius-m: 6px;
    --radius-l: 14px;
    --ease: cubic-bezier(.19,1,.22,1);
    --side-rail: 72px;
    --side-expanded: 264px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background-color: #F7FAFC;
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  h1,h2,h3{
    font-family: var(--font-serif);
    font-weight:400;
    letter-spacing: 0;
    margin: 0;
    color: var(--ink);
  }
  p{ margin:0; }
  a{ color: inherit; text-decoration: none; }
  button{ font-family: inherit; cursor: pointer; }
  ::selection{ background: var(--accent-soft); color: var(--ink); }

  .wrap{ max-width: 1080px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 640px){ .wrap{ padding: 0 20px; } }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding: 12px 24px;
    border-radius: var(--radius-s);
    font-size: 14.5px; font-weight: 500;
    transition: transform .35s var(--ease), background .3s, box-shadow .3s, opacity .2s;
    border: none;
  }
  .btn-primary{ background: var(--ink); color: #fff; }
  .btn-primary:hover{ background: var(--accent); transform: translateY(-1px); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
  .btn-ghost{ color: var(--ink); border: 1px solid var(--line); background: transparent; }
  .btn-ghost:hover{ border-color: var(--ink); }

  .card{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-l);
    padding: 28px;
  }

  .reveal{ opacity: 0; transform: translateY(22px); }

  /* ---------- side nav (shared with trainer/history pages) ---------- */
  .side-nav{
    position: fixed; top:0; left:0; bottom:0; z-index: 200;
    width: var(--side-rail);
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    display:flex; flex-direction:column;
    padding: 18px 0 16px;
    overflow: hidden;
    transition: width .4s var(--ease), box-shadow .4s var(--ease);
  }
  .side-nav:hover, .side-nav:focus-within{
    width: var(--side-expanded);
    box-shadow: 12px 0 40px rgba(22,34,46,.10);
  }
  @media (max-width: 860px){ .side-nav{ display:none; } }

  .side-nav-items{ display:flex; flex-direction:column; gap:4px; padding: 6px 12px; }
  .side-nav-item{
    display:flex; align-items:center; gap:16px;
    padding: 11px 10px; border-radius: var(--radius-m);
    white-space:nowrap; transition: background .2s;
    color: var(--ink-soft);
  }
  .side-nav-item:hover{ background: var(--bg-soft); color: var(--ink); }
  .side-nav-item.is-active{ color: var(--accent); }
  .side-nav-item.is-active .side-nav-icon{ background: var(--accent); color:#fff; }
  .side-nav-icon{
    flex-shrink:0; width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--bg-soft); color: var(--ink);
  }
  .side-nav-item.is-profile .side-nav-icon{
    background: var(--ink); color:#fff; font-family:var(--font-serif); font-size:13.5px; font-weight:400;
  }
  .side-nav-icon svg{ width:17px; height:17px; }
  .side-nav-label{
    font-size:14px;
    opacity:0; transform: translateX(-6px);
    transition: opacity .3s var(--ease) .05s, transform .3s var(--ease) .05s;
  }
  .side-nav:hover .side-nav-label, .side-nav:focus-within .side-nav-label{ opacity:1; transform:translateX(0); }

  .side-nav-spacer{ flex:1; }

  .side-word-card{
    margin: 0 12px; padding: 16px 14px;
    border: 1px solid var(--line); border-radius: var(--radius-m);
    background: var(--bg-soft);
    opacity:0; visibility:hidden;
    transition: opacity .3s var(--ease) .05s, visibility .3s;
  }
  .side-nav:hover .side-word-card, .side-nav:focus-within .side-word-card{ opacity:1; visibility:visible; }
  .side-word-title{ font-family:var(--font-serif); font-size:15px; margin-bottom:6px; white-space:normal; }
  .side-word-def{ font-size:12px; line-height:1.5; color: var(--ink-soft); white-space:normal; }

  /* ---------- header ---------- */
  header{
    position: sticky; top:0; z-index: 50;
    background: rgba(247,250,252,0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  nav.wrap{
    display:flex; align-items:center; justify-content:space-between;
    height: 72px;
  }
  .logo{ font-family:var(--font-serif); font-size: 19px; font-weight:400; }
  .logo span{ color: var(--accent); }

  .user-menu{ position:relative; display:flex; align-items:center; gap:12px; }
  .avatar{
    width:36px; height:36px; border-radius:50%;
    background: var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:400; font-family:var(--font-serif);
    flex-shrink:0;
  }
  .user-name{ font-size:14px; color: var(--ink); }
  @media (max-width: 560px){ .user-name{ display:none; } }
  .user-menu-btn{
    display:flex; align-items:center; gap:10px; background:transparent; border:none; padding:4px;
    border-radius: 20px; transition: background .2s;
  }
  .user-menu-btn:hover{ background: var(--bg-soft); }
  .chevron{ width:9px; height:9px; border-right:1.5px solid var(--ink-faint); border-bottom:1.5px solid var(--ink-faint); transform:rotate(45deg); margin-top:-3px; transition: transform .25s var(--ease); }
  .user-menu.is-open .chevron{ transform: rotate(225deg); margin-top:3px; }

  .user-dropdown{
    position:absolute; top: calc(100% + 10px); right:0; min-width:190px;
    background: var(--bg-panel); border:1px solid var(--line); border-radius: var(--radius-m);
    box-shadow: 0 16px 40px rgba(22,34,46,.14);
    padding:8px; z-index: 60;
    opacity:0; visibility:hidden; transform: translateY(-6px);
    transition: opacity .25s var(--ease), transform .25s var(--ease), visibility .25s;
  }
  .user-menu.is-open .user-dropdown{ opacity:1; visibility:visible; transform: translateY(0); }
  .user-dropdown a, .user-dropdown button{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:10px 12px; border-radius: var(--radius-s); font-size:13.5px; color: var(--ink-soft);
    transition: background .15s, color .15s;
  }
  .user-dropdown a:hover, .user-dropdown button:hover{ background: var(--bg-soft); color: var(--ink); }
  .user-dropdown .divider{ height:1px; background: var(--line); margin: 6px 4px; }

  .head-right{ display:flex; align-items:center; gap:12px; }
  .lang-switch{ display:inline-flex; padding:3px; gap:2px; background: var(--bg-soft); border-radius:999px; }
  .lang-btn{
    border:none; background:transparent; padding:7px 13px; border-radius:999px;
    font-size:12.5px; letter-spacing:.04em; color: var(--ink-soft);
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  .lang-btn:hover{ color: var(--ink); }
  .lang-btn.is-active{ background: var(--ink); color:#fff; }
  .lang-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  header .head-cta{ padding:10px 20px; font-size:14px; white-space:nowrap; }
  @media (max-width:520px){
    .head-right{ gap:6px; }
    .lang-btn{ padding:7px 9px; font-size:12px; }
    header .head-cta{ padding:9px 12px; font-size:12.5px; min-height:0; }
    header .logo{ font-size:17px; padding:10px 0; }
  }
  @media (max-width:360px){
    header .logo{ font-size:15px; }
    header .head-cta{ padding:8px 10px; font-size:12px; }
    .lang-btn{ padding:6px 7px; }
  }
  main{ padding-bottom: 90px; }
  section{ padding: 56px 0; }
  section + section{ border-top: 1px solid var(--line); }
  .section-head{ margin-bottom: 26px; }
  .section-head .eyebrow{ font-size: 12.5px; color: var(--ink-faint); letter-spacing:.03em; margin-bottom: 8px; }
  .section-head h2{ font-size: 26px; }

  /* ---------- mode toggle ---------- */
  .mode-toggle{
    display:inline-flex; flex-wrap:wrap; row-gap:6px; padding:4px; gap:4px;
    background: var(--bg-soft); border-radius: 999px;
  }
  .mode-btn{
    border:none; background:transparent; padding:10px 20px; border-radius:999px;
    font-size:13.5px; color: var(--ink-soft); white-space:nowrap;
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  .mode-btn:hover{ color: var(--ink); }
  .mode-btn.is-active{ background: var(--ink); color:#fff; }

  /* ---------- roulette ---------- */
  .generator-layout{
    display:flex; align-items:center; gap:48px; margin-top:32px; flex-wrap:wrap;
  }
  @media (max-width: 760px){ .generator-layout{ flex-direction:column; gap:30px; } }

  .roulette-card{
    position:relative;
    flex:1 1 100%; width:100%; min-width:0;
    background: linear-gradient(165deg, #FFFFFF 0%, #F3F8FB 100%);
    border: 1px solid var(--line); border-radius: var(--radius-l);
    overflow:hidden;
    box-shadow: 0 20px 46px rgba(22,34,46,.06);
  }
  .roulette-row{
    position:relative;
    display:flex; align-items:center; justify-content:center; text-align:center;
    box-sizing:border-box;
    padding: 24px 30px;
    font-family:var(--font-serif); font-size: 26px; line-height:1.32;
  }
  .roulette-row + .roulette-row{ border-top: 1px solid var(--line); }
  .roulette-row.is-edge{
    color: var(--ink-faint); font-weight:400;
    transition: color .2s var(--ease);
  }
  .roulette-row.is-current{
    color: var(--ink); font-weight:560;
    padding: 32px 28px;
    transition: color .2s var(--ease), opacity .18s var(--ease);
  }
  .roulette-row.is-current.is-spinning{ color: var(--ink-soft); }
  @media (max-width: 640px){
    .roulette-row{ font-size:18.5px; padding:16px 18px; }
    .roulette-row.is-current{ padding:22px 18px; }
  }
  @keyframes rouletteLand{
    0%{ transform: scale(.97); }
    55%{ transform: scale(1.015); }
    100%{ transform: scale(1); }
  }
  .roulette-row.is-current.is-landed{ animation: rouletteLand .5s var(--ease); }

  .generator-actions{ display:flex; gap:14px; margin-top:34px; flex-wrap:wrap; }

  /* ---------- timer ---------- */
  .timer-card{
    margin-top: 24px;
    display:flex; align-items:center; gap:30px; flex-wrap:wrap; justify-content:space-between;
  }
  .timer-left{ display:flex; flex-direction:column; gap:14px; flex:1; min-width:220px; }
  .timer-eyebrow{ font-size:12.5px; color: var(--ink-faint); letter-spacing:.02em; }
  .timer-duration-picker{ display:flex; gap:8px; flex-wrap:wrap; }
  .timer-chip{
    font-size:13px; color: var(--ink-soft); background: var(--bg-soft);
    border:1px solid transparent; padding:8px 15px; border-radius:20px; cursor:pointer;
    transition: background .2s var(--ease), color .2s var(--ease);
  }
  .timer-chip:hover{ background: var(--accent-soft); color: var(--accent); }
  .timer-chip.is-selected{ background: var(--ink); color:#fff; }
  .timer-controls{ display:flex; gap:12px; }

  .timer-ring-wrap{ display:grid; place-items:center; width:132px; height:132px; flex-shrink:0; }
  .timer-ring-wrap > *{ grid-area: 1 / 1; }
  .timer-ring-svg circle{ fill:none; }
  .timer-ring-track{ stroke: var(--bg-soft); }
  .timer-ring-progress{ stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .3s; }
  .timer-ring-wrap.is-done .timer-ring-progress{ stroke: var(--good); }
  .timer-value{ font-family:var(--font-serif); font-size:22px; font-variant-numeric: tabular-nums; }
  .timer-ring-wrap.is-done .timer-value{ font-size:15px; color: var(--good); }


  /* ---------- mobile bottom nav (5 tabs: icon + label, same on every page) ---------- */
  .mobile-nav{
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:80;
    background: rgba(255,255,255,.95); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top:1px solid var(--line);
    padding: 4px max(4px, env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
  }
  @media (max-width: 860px){ .mobile-nav{ display:flex; } main{ padding-bottom: calc(92px + env(safe-area-inset-bottom)); } }
  .mobile-nav a{
    flex:1 1 0; min-width:0; min-height:54px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding: 6px 2px; border-radius: var(--radius-m);
    font-size:11px; line-height:1.15; color: var(--ink-faint);
    transition: color .2s, background .2s;
  }
  .mobile-nav .label{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mobile-nav svg{ width:22px; height:22px; flex-shrink:0; }
  .mobile-nav a:active{ background: var(--bg-soft); }
  .mobile-nav a.is-active{ color: var(--accent); }
  .mobile-nav a.is-active svg{ stroke-width:2; }
  @media (max-width: 340px){ .mobile-nav a{ font-size:10px; } }

  .loading-gate{
    position:fixed; inset:0; background: var(--bg); z-index:500;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; color: var(--ink-faint);
    transition: opacity .4s var(--ease);
  }
  .loading-gate.is-hidden{ opacity:0; pointer-events:none; }

  .hidden{ display:none !important; }

  /* ---------- typography (Inter + PT Serif, Russian) ---------- */
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{ font-kerning:normal; text-rendering:optimizeLegibility; }
  h1,h2,h3{ text-wrap:balance; hyphens:manual; }
  p{ text-wrap:pretty; }

  /* ---------- mobile polish ---------- */
  html{ -webkit-tap-highlight-color: transparent; }
  a, button, [role="button"], [role="link"], input, select, textarea{ touch-action: manipulation; }
  body:has(.modal-overlay.is-open){ overflow:hidden; }
  .modal-card{ max-height: 82dvh; }
  @media (max-width: 860px){
    header{ padding-top: env(safe-area-inset-top); }
    nav.wrap{ height: 60px; }
    .logo{ padding: 10px 0; }
    .btn{ min-height: 44px; }
    .user-menu-btn{ min-height: 44px; }
    .user-dropdown a, .user-dropdown button{ padding: 13px 14px; font-size: 15px; }
    .modal-close{ width: 40px; height: 40px; top: 10px; right: 10px; font-size: 16px; }
  }
  @media (max-width: 640px){
    section{ padding: 40px 0; }
    .section-head{ margin-bottom: 20px; }
    .section-head h2{ font-size: 23px; }
    .modal-overlay{ align-items: flex-end; padding: 0; }
    .modal-card{
      max-width: none; max-height: 88vh; max-height: 88dvh;
      border-radius: var(--radius-l) var(--radius-l) 0 0; border-bottom: none;
      padding: 30px 20px calc(24px + env(safe-area-inset-bottom));
      transform: translateY(36px); overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    }
    .modal-overlay.is-open .modal-card{ transform: translateY(0); }
  }
  @media (max-width: 640px){
    .mode-toggle{ display: grid; grid-template-columns: repeat(2, 1fr); width: 100%; border-radius: var(--radius-l); }
    .mode-btn{ padding: 12px 10px; border-radius: 10px; white-space: normal; line-height: 1.25; min-height: 44px; }
    .mode-btn:last-child:nth-child(odd){ grid-column: 1 / -1; }
  }

  /* ================= синхронизация с index.html ================= */
  #bgImage{ position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; background:url('background.jpg') center / cover no-repeat; }
  img.emoji{ display:inline-block; width:1.15em; height:1.15em; vertical-align:-0.2em; margin:0 .04em; }

  /* Шрифты интерфейса: как в index (кнопки, навигация, меню, чипы, логотип) */
  .btn, .side-nav-item, .user-dropdown a, .user-dropdown button,
  .mode-btn, .timer-chip, .kind-btn, .skill-reset, .logo{
    font-family: var(--font-serif); font-weight:400;
  }
  .btn{ font-size:16.5px; }
  .side-nav-item{ font-size:16px; }
  .user-dropdown a, .user-dropdown button{ font-size:15.5px; }
  .mode-btn, .timer-chip, .kind-btn{ font-size:15px; }
  .logo{ font-size:22px; }
  .section-head .eyebrow{ font-family: var(--font-sans); font-size:15px; }
  .welcome h1{ font-family: var(--font-sans); font-size: clamp(34px, 5vw, 54px); }
  .welcome-sub{ font-family: var(--font-hand); font-size:25px; color: var(--accent); }

  /* Стекло поверх фонового видео (как .card и header в index) */
  .card, header, .roulette-card, .training-card,
  .skill-shortcut, .kind-switch, .lib-card.lc{ background: rgba(247,250,252,0.30); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
  .roulette-card, .training-card{ background-image:none; }

  /* Кнопки: скруглённые, цвет --accent */
  .btn{ border-radius:999px; padding:12px 26px; }
  .btn-primary{ background: var(--accent); color:#fff; }
  .btn-primary:hover{ background: var(--accent); filter: brightness(.9); transform: translateY(-1px); }
  .btn-primary.is-copied{ background: var(--good); filter:none; }
  .btn-ghost{ border-radius:999px; }
  .btn-ghost:hover{ border-color: var(--accent); color: var(--accent); }
  .btn-danger-ghost, .btn-danger-solid{ border-radius:999px; }
  @media (max-width: 860px){ .btn{ min-height:44px; } }

  /* Скользящий индикатор выбора (как .tc-type-indicator в index, цвет --accent) */
  .sel-indicator{
    position:absolute; top:0; left:0; z-index:0; pointer-events:none; opacity:0;
    transition: transform .5s var(--ease), width .5s var(--ease), height .5s var(--ease), opacity .3s var(--ease);
  }
  .sel-indicator.is-ready{ opacity:1; }
  .sel-indicator.no-anim{ transition:none; }
  .sel-indicator.is-fill-accent{ background: var(--accent); }
  .sel-indicator.is-outline{ z-index:2; border:1.5px solid var(--accent); background: rgba(0,119,179,.05); }
  [data-slide-host]{ position:relative; }
  [data-slide-host] > :not(.sel-indicator){ position:relative; z-index:1; }
  @media (prefers-reduced-motion: reduce){ .sel-indicator{ transition:none; } }

  .mode-toggle .mode-btn.is-active, .mode-toggle .mode-btn.is-active:hover{ background: transparent; color:#fff; }
  .timer-duration-picker .timer-chip.is-selected, .timer-duration-picker .timer-chip.is-selected:hover{ background: transparent; color:#fff; }
  .timer-duration-picker .timer-chip:hover{ background: transparent; }
  .kind-switch .kind-btn.is-active, .kind-switch .kind-btn.is-active:hover{ background: transparent; color:#fff; }
  #skillShortcuts .skill-shortcut.is-active{ border-color: var(--line); box-shadow:none; }
  #skillShortcuts .skill-shortcut.is-active:hover{ border-color: rgba(0,119,179,.35); }

  /* «Крутить!»: перелив градиента + блик при наведении, «вдавливание» при нажатии (как «Начать запись» в index) */
  #spinBtn{
    position:relative; overflow:hidden; isolation:isolate;
    background: linear-gradient(110deg, #0077B3 0%, #3AA8DC 50%, #0077B3 100%);
    background-size: 200% 100%; background-position: 0% 50%;

    if (pool.length === 1) return pool[0];
    let topic;
    do { topic = pool[Math.floor(Math.random() * pool.length)]; } while (topic.id === avoidId);
    return topic;
  }

  function renderRoulette(topic, opts){
    opts = opts || {};
    if (!topic){
      rouletteCurrent.textContent = t('unavailable');
      rouletteEdgeTop.textContent = '—';
      rouletteEdgeBottom.textContent = '—';
      return;
    }
    const pool = state.pools[state.mode];
    const edgeTop = pickRandomTopic(pool, topic.id);
    const edgeBottom = pickRandomTopic(pool, topic.id);
    rouletteCurrent.textContent = topic.text;
    rouletteEdgeTop.textContent = edgeTop ? edgeTop.text : '—';
    rouletteEdgeBottom.textContent = edgeBottom ? edgeBottom.text : '—';
    if (opts.landed){
      rouletteCurrent.classList.remove('is-landed');
      // eslint-disable-next-line no-unused-expressions
      void rouletteCurrent.offsetWidth; // restart the CSS animation
      rouletteCurrent.classList.add('is-landed');
    }
  }

  function setMode(mode, opts){
    opts = opts || {};
    state.mode = mode;
    modeButtons.forEach((btn) => {
      const active = btn.dataset.mode === mode;
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    if (!opts.silent){
      const pool = state.pools[mode];
      state.current = pickRandomTopic(pool);
      renderRoulette(state.current);
    }
  }
  modeButtons.forEach((btn) => {
    btn.addEventListener('click', () => { if (!state.spinning) setMode(btn.dataset.mode); });
  });

  function spin(){
    if (state.spinning) return;
    const pool = state.pools[state.mode];
    if (!pool || pool.length === 0) return;
    state.spinning = true;
    spinBtn.disabled = true;
    rouletteCurrent.classList.remove('is-landed');
    rouletteCurrent.classList.add('is-spinning');

    const target = pickRandomTopic(pool, state.current ? state.current.id : null);
    const totalSteps = reduceMotion ? 1 : (18 + Math.floor(Math.random() * 6));
    let step = 0;
    let delay = reduceMotion ? 0 : 55;

    function tick(){
      const isLastStep = step >= totalSteps - 1;
      const shown = isLastStep ? target : pickRandomTopic(pool);
      renderRoulette(shown);
      if (isLastStep) playLandChime(); else playSpinTick();
      step += 1;
      if (!isLastStep){
        delay = delay * 1.13;
        setTimeout(tick, delay);
      } else {
        state.current = target;
        rouletteCurrent.classList.remove('is-spinning');
        renderRoulette(target, { landed: true });
        state.spinning = false;
        spinBtn.disabled = false;
      }
    }
    setTimeout(tick, reduceMotion ? 0 : 55);
  }

  spinBtn.addEventListener('click', spin);

  /* ---------- timer ---------- */

  function formatTime(totalSeconds){
    const mm = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
    const ss = String(totalSeconds % 60).padStart(2, '0');
    return `${mm}:${ss}`;
  }
  function renderTimer(){
    timerValue.textContent = formatTime(state.timer.remaining);
    const frac = state.timer.duration > 0 ? state.timer.remaining / state.timer.duration : 0;
    timerRingProgress.style.strokeDashoffset = String(RING_CIRC * (1 - frac));
  }
  function stopTimerInterval(){
    if (state.timer.handle) clearInterval(state.timer.handle);
    state.timer.handle = null;
  }
  function startTimer(){
    if (state.timer.remaining <= 0) state.timer.remaining = state.timer.duration;
    state.timer.running = true;
    timerRingWrap.classList.remove('is-done');
    state.ui.start = 'pause'; state.ui.done = false;
    timerStartBtn.textContent = t('pause');
    stopTimerInterval();
    state.timer.handle = setInterval(() => {
      state.timer.remaining -= 1;
      if (state.timer.remaining <= 0){
        state.timer.remaining = 0;
        renderTimer();
        stopTimerInterval();
        state.timer.running = false;
        state.ui.start = 'start'; state.ui.done = true;
        timerStartBtn.textContent = t('start');
        timerRingWrap.classList.add('is-done');
        timerValue.textContent = t('done');
        playTimerDone();
        return;
      }
      if (state.timer.remaining <= 5) playTimerTick();
      renderTimer();
    }, 1000);
    renderTimer();
  }
  function pauseTimer(){
    stopTimerInterval();
    state.timer.running = false;
    state.ui.start = 'resume';
    timerStartBtn.textContent = t('resume');
  }
  function resetTimer(){
    stopTimerInterval();
    state.timer.running = false;
    state.timer.remaining = state.timer.duration;
    state.ui.start = 'start'; state.ui.done = false;
    timerStartBtn.textContent = t('start');
    timerRingWrap.classList.remove('is-done');
    renderTimer();
  }

  timerToggleBtn.addEventListener('click', () => {
    const willShow = timerCard.classList.contains('hidden');
    timerCard.classList.toggle('hidden');
    state.ui.toggle = willShow ? 'timerHide' : 'timerShow';
    timerToggleBtn.textContent = t(state.ui.toggle);
    if (willShow && !reduceMotion){
      gsap.fromTo(timerCard, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .5, ease: 'power3.out' });
    }
  });
  timerChips.forEach((chip) => {
    chip.addEventListener('click', () => {
      if (state.timer.running) return;
      timerChips.forEach((c) => c.classList.remove('is-selected'));
      chip.classList.add('is-selected');
      const seconds = parseInt(chip.dataset.seconds, 10);
      state.timer.duration = seconds;
      state.timer.remaining = seconds;
      state.ui.done = false;
      timerRingWrap.classList.remove('is-done');
      renderTimer();
    });
  });
  timerStartBtn.addEventListener('click', () => {
    if (state.timer.running) pauseTimer(); else startTimer();
  });
  timerResetBtn.addEventListener('click', resetTimer);

  /* ---------- language ---------- */

  const langButtons = Array.from(document.querySelectorAll('.lang-btn'));
  function applyLang(){
    document.documentElement.lang = state.lang;
    document.title = t('title');
    const md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute('content', t('desc'));
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    langButtons.forEach((b) => {
      const on = b.dataset.lang === state.lang;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    timerToggleBtn.textContent = t(state.ui.toggle);
    timerStartBtn.textContent = t(state.ui.start);
    if (state.ui.done) timerValue.textContent = t('done'); else renderTimer();
  }

  function setLang(lang){
    if (lang === state.lang || state.spinning) return;
    state.lang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* private mode */ }
    const prevId = state.current ? state.current.id : null;
    state.pools = TOPICS[lang] || TOPICS.ru;
    const pool = state.pools[state.mode];
    // тема остаётся той же, меняется только язык
    state.current = (pool && pool.find((x) => x.id === prevId)) || pickRandomTopic(pool);
    applyLang();
    renderRoulette(state.current, { landed: true });
  }
  langButtons.forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));

  /* ---------- reveal + nav highlight ---------- */

  function setupRevealAnimations(){
    if (reduceMotion){
      document.querySelectorAll('.reveal').forEach(el => el.style.opacity = 1);
      return;
    }
    document.querySelectorAll('.reveal').forEach((el) => {
      gsap.to(el, {
        opacity: 1, y: 0, duration: 0.9, ease: 'power3.out',
        scrollTrigger: { trigger: el, start: 'top 92%' },
      });
    });
  }

  async function init(){
    loadTopics();
    applyLang();
    state.current = pickRandomTopic(state.pools[state.mode]);
    renderRoulette(state.current);
    renderTimer();

    loadingGate.classList.add('is-hidden');
    setTimeout(() => { loadingGate.style.display = 'none'; }, 450);

    setupRevealAnimations();
  }

  init();
})();
</script>

<script>
/* Скользящий индикатор выбора. Следит за сменой класса активного элемента,
   поэтому существующая логика страницы не меняется. */
(function(){
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function slideSelect(host, itemSel, activeCls, kind){
    if (!host) return;
    host.setAttribute('data-slide-host', '');
    var ind = document.createElement('span');
    ind.className = 'sel-indicator ' + kind;
    ind.setAttribute('aria-hidden', 'true');
    var first = true;

    function ensure(){ if (ind.parentNode !== host) host.appendChild(ind); }

    function place(animate){
      ensure();
      var el = host.querySelector(itemSel + '.' + activeCls);
      if (!el || !el.offsetWidth){ ind.classList.remove('is-ready'); return; }
      var noAnim = !animate || first || reduce;
      if (noAnim) ind.classList.add('no-anim');
      ind.style.width = el.offsetWidth + 'px';
      ind.style.height = el.offsetHeight + 'px';
      ind.style.borderRadius = getComputedStyle(el).borderRadius;
      ind.style.transform = 'translate(' + el.offsetLeft + 'px,' + el.offsetTop + 'px)';
      ind.classList.add('is-ready');
      if (noAnim){ void ind.offsetWidth; ind.classList.remove('no-anim'); }
      first = false;
    }

    var mo = new MutationObserver(function(list){
      // изменения самого индикатора игнорируем, иначе цикл
      list = list.filter(function(r){
        if (r.target === ind) return false;
        if (r.type === 'childList') {
          var only = Array.prototype.every.call(r.addedNodes, function(n){ return n === ind; }) &&
                     Array.prototype.every.call(r.removedNodes, function(n){ return n === ind; });
          return !only;
        }
        return true;
      });
      if (!list.length) return;
      // перерисовка содержимого (innerHTML) — ставим без анимации
      if (list.some(function(r){ return r.type === 'childList'; })) first = true;
      place(true);
    });
    mo.observe(host, { attributes:true, attributeFilter:['class'], subtree:true, childList:true });

    if (window.ResizeObserver) new ResizeObserver(function(){ place(false); }).observe(host);
    window.addEventListener('resize', function(){ place(false); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ place(false); });
    place(false);
  }

  window.slideSelect = slideSelect;
  
  slideSelect(document.getElementById('modeToggle'), '.mode-btn', 'is-active', 'is-fill-accent');
  slideSelect(document.querySelector('.timer-duration-picker'), '.timer-chip', 'is-selected', 'is-fill-accent');

})();
</script>
<script>
/* Эмодзи из своей библиотеки картинок: одинаково на любых устройствах.
   Любой эмодзи-символ в тексте страницы (в том числе появившийся позже)
   заменяется на <img src="emoji/1f600.png">. Настройте три константы ниже
   под вашу библиотеку. */
(function(){
  const EMOJI_PATH = 'emoji/';     // папка с картинками рядом с index.html
  const EMOJI_EXT  = 'png';        // png / svg / webp
  const STRIP_FE0F = false;        // true, если в именах файлов нет «fe0f» (как в Twemoji)

  const unit = '(?:\\p{Emoji_Presentation}|\\p{Extended_Pictographic}\\uFE0F)(?:\\p{Emoji_Modifier})?';
  const RE = new RegExp(
    '\\p{Regional_Indicator}{2}|[#*0-9]\\uFE0F?\\u20E3|' + unit +
    '(?:\\u200D(?:\\p{Emoji_Presentation}|\\p{Extended_Pictographic})\\uFE0F?(?:\\p{Emoji_Modifier})?)*', 'gu');

  const SKIP = 'script,style,textarea,input,svg,[data-no-emoji],#transcriptText,img.emoji';

  const fileName = (emoji, strip) => {
    let cps = Array.from(emoji).map(c => c.codePointAt(0).toString(16));
    if (strip) cps = cps.filter(c => c !== 'fe0f');
    return cps.join('-');
  };

  function makeImg(emoji){
    const img = document.createElement('img');
    img.className = 'emoji';
    img.alt = emoji;
    img.draggable = false;
    let strip = STRIP_FE0F, retried = false;
    img.src = EMOJI_PATH + fileName(emoji, strip) + '.' + EMOJI_EXT;
    img.onerror = () => {
      if (!retried){                 // пробуем имя с/без fe0f
        retried = true;
        img.src = EMOJI_PATH + fileName(emoji, !strip) + '.' + EMOJI_EXT;
      } else {                       // нет картинки — показываем обычный символ
        // Обёртка с data-no-emoji: иначе наблюдатель снова превратит символ
        // в <img>, и запросы к отсутствующему файлу идут по кругу.
        const fallback = document.createElement('span');
        fallback.setAttribute('data-no-emoji', '');
        fallback.textContent = emoji;
        img.replaceWith(fallback);
      }
    };
    return img;
  }

  function convertText(node){
    const text = node.nodeValue;
    RE.lastIndex = 0;
    if (!RE.test(text)) return;
    RE.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = RE.exec(text))){
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      frag.appendChild(makeImg(m[0]));
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.replaceWith(frag);
  }

  function convert(root){
    if (root.nodeType === 3){
      if (!root.parentElement || !root.parentElement.closest(SKIP)) convertText(root);
      return;
    }
    if (root.nodeType !== 1 || root.closest(SKIP)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => n.parentElement && n.parentElement.closest(SKIP) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(convertText);
  }

  window.renderEmoji = convert;      // можно вызвать вручную: renderEmoji(element)
  convert(document.body);

  let queue = new Set(), scheduled = false;
  new MutationObserver(muts => {
    muts.forEach(mu => {
      if (mu.type === 'characterData') queue.add(mu.target);
      else mu.addedNodes.forEach(n => queue.add(n));
    });
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      const items = Array.from(queue); queue = new Set();
      items.forEach(n => { if (n.isConnected) convert(n); });
    });
  }).observe(document.body, { childList:true, subtree:true, characterData:true });
})();
</script>

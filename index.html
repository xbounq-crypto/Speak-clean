<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7FAFC">
<title>Генератор тем для речи — говори·ясно</title>
<meta name="description" content="Крути рулетку и получай тему для речи: случайные темы, истории, аргументация, питч.">
<link rel="icon" type="image/png" href="static/favicon.png">
<style>
  /* Lora (serif) and Excalifont (handwritten). Files live in
     static/fonts/ next to index.html; until then the fallbacks
     (PT Serif / Caveat) are used, so nothing breaks. */
  @font-face{
    font-family:'Lora'; font-style:normal; font-weight:400; font-display:swap;
    src: local('Lora'),
         url('static/fonts/Lora.ttf') format('truetype');
  }
  @font-face{
    font-family:'Onest'; font-style:normal; font-weight:400; font-display:swap;
    src: local('Onest'),
         url('static/fonts/Onest-Light.ttf') format('truetype');
  }
    @font-face{
    font-family:'Caveat'; font-style:normal; font-weight:100; font-display:swap;
    src: local('Caveat'),
         url('static/fonts/Caveat.ttf') format('truetype');
  }
  :root{
    --font-sans: 'Lora', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-serif: 'Onest', 'PT Serif', Georgia, 'Times New Roman', serif;
    --font-hand: 'Caveat', 'Comic Sans MS', cursive;
    --bg: #F7FAFC;
    --bg-panel: #FFFFFF;
    --bg-soft: #EEF3F7;
    --ink: #16222E;
    --ink-soft: #5C6B77;
    --ink-faint: #93A1AC;
    --line: #D5DEE2;
    --line-strong: #B4C2CB;   /* рамка баров выбора: чуть темнее обычной линии */
    --accent: #0077B3;
    --accent-soft: #E4F1F8;
    --warm: #C6853E;
    --warm-soft: #FAF0E1;
    --good: #2F8F5B;
    --good-soft: #E4F5EB;
    --caution: #7A5CB8;
    --caution-soft: #EEE9F7;
    --danger: #C6483E;
    --danger-soft: #FBE9E7;
    --radius-s: 3px;
    --radius-m: 6px;
    --radius-l: 14px;
    --ease: cubic-bezier(.19,1,.22,1);
    --side-rail: 72px;
    --side-expanded: 264px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background-color: #F7FAFC;
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  h1,h2,h3{
    font-family: var(--font-serif);
    font-weight:400;
    letter-spacing: 0;
    margin: 0;
    color: var(--ink);
  }
  p{ margin:0; }
  a{ color: inherit; text-decoration: none; }
  button{ font-family: inherit; cursor: pointer; }
  ::selection{ background: var(--accent-soft); color: var(--ink); }

  .wrap{ max-width: 1080px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 640px){ .wrap{ padding: 0 20px; } }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding: 12px 24px;
    border-radius: var(--radius-s);
    font-size: 14.5px; font-weight: 500;
    transition: transform .35s var(--ease), background .3s, box-shadow .3s, opacity .2s;
    border: none;
  }
  .btn-primary{ background: var(--ink); color: #fff; }
  .btn-primary:hover{ background: var(--accent); transform: translateY(-1px); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
  .btn-ghost{ color: var(--ink); border: 1px solid var(--line); background: transparent; }
  .btn-ghost:hover{ border-color: var(--ink); }

  .card{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-l);
    padding: 28px;
  }

  .reveal{ opacity: 0; transform: translateY(22px); }

  /* ---------- side nav (shared with trainer/history pages) ---------- */
  .side-nav{
    position: fixed; top:0; left:0; bottom:0; z-index: 200;
    width: var(--side-rail);
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    display:flex; flex-direction:column;
    padding: 18px 0 16px;
    overflow: hidden;
    transition: width .4s var(--ease), box-shadow .4s var(--ease);
  }
  .side-nav:hover, .side-nav:focus-within{
    width: var(--side-expanded);
    box-shadow: 12px 0 40px rgba(22,34,46,.10);
  }
  @media (max-width: 860px){ .side-nav{ display:none; } }

  .side-nav-items{ display:flex; flex-direction:column; gap:4px; padding: 6px 12px; }
  .side-nav-item{
    display:flex; align-items:center; gap:16px;
    padding: 11px 10px; border-radius: var(--radius-m);
    white-space:nowrap; transition: background .2s;
    color: var(--ink-soft);
  }
  .side-nav-item:hover{ background: var(--bg-soft); color: var(--ink); }
  .side-nav-item.is-active{ color: var(--accent); }
  .side-nav-item.is-active .side-nav-icon{ background: var(--accent); color:#fff; }
  .side-nav-icon{
    flex-shrink:0; width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--bg-soft); color: var(--ink);
  }
  .side-nav-item.is-profile .side-nav-icon{
    background: var(--ink); color:#fff; font-family:var(--font-serif); font-size:13.5px; font-weight:400;
  }
  .side-nav-icon svg{ width:17px; height:17px; }
  .side-nav-label{
    font-size:14px;
    opacity:0; transform: translateX(-6px);
    transition: opacity .3s var(--ease) .05s, transform .3s var(--ease) .05s;
  }
  .side-nav:hover .side-nav-label, .side-nav:focus-within .side-nav-label{ opacity:1; transform:translateX(0); }

  .side-nav-spacer{ flex:1; }

  .side-word-card{
    margin: 0 12px; padding: 16px 14px;
    border: 1px solid var(--line); border-radius: var(--radius-m);
    background: var(--bg-soft);
    opacity:0; visibility:hidden;
    transition: opacity .3s var(--ease) .05s, visibility .3s;
  }
  .side-nav:hover .side-word-card, .side-nav:focus-within .side-word-card{ opacity:1; visibility:visible; }
  .side-word-title{ font-family:var(--font-serif); font-size:15px; margin-bottom:6px; white-space:normal; }
  .side-word-def{ font-size:12px; line-height:1.5; color: var(--ink-soft); white-space:normal; }

  /* ---------- header ---------- */
  header{
    position: sticky; top:0; z-index: 50;
    background: rgba(247,250,252,0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  nav.wrap{
    display:flex; align-items:center; justify-content:space-between;
    height: 72px;
  }
  .logo{ font-family:var(--font-serif); font-size: 19px; font-weight:400; }
  .logo span{ color: var(--accent); }

  .user-menu{ position:relative; display:flex; align-items:center; gap:12px; }
  .avatar{
    width:36px; height:36px; border-radius:50%;
    background: var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:400; font-family:var(--font-serif);
    flex-shrink:0;
  }
  .user-name{ font-size:14px; color: var(--ink); }
  @media (max-width: 560px){ .user-name{ display:none; } }
  .user-menu-btn{
    display:flex; align-items:center; gap:10px; background:transparent; border:none; padding:4px;
    border-radius: 20px; transition: background .2s;
  }
  .user-menu-btn:hover{ background: var(--bg-soft); }
  .chevron{ width:9px; height:9px; border-right:1.5px solid var(--ink-faint); border-bottom:1.5px solid var(--ink-faint); transform:rotate(45deg); margin-top:-3px; transition: transform .25s var(--ease); }
  .user-menu.is-open .chevron{ transform: rotate(225deg); margin-top:3px; }

  .user-dropdown{
    position:absolute; top: calc(100% + 10px); right:0; min-width:190px;
    background: var(--bg-panel); border:1px solid var(--line); border-radius: var(--radius-m);
    box-shadow: 0 16px 40px rgba(22,34,46,.14);
    padding:8px; z-index: 60;
    opacity:0; visibility:hidden; transform: translateY(-6px);
    transition: opacity .25s var(--ease), transform .25s var(--ease), visibility .25s;
  }
  .user-menu.is-open .user-dropdown{ opacity:1; visibility:visible; transform: translateY(0); }
  .user-dropdown a, .user-dropdown button{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:10px 12px; border-radius: var(--radius-s); font-size:13.5px; color: var(--ink-soft);
    transition: background .15s, color .15s;
  }
  .user-dropdown a:hover, .user-dropdown button:hover{ background: var(--bg-soft); color: var(--ink); }
  .user-dropdown .divider{ height:1px; background: var(--line); margin: 6px 4px; }

  .mode-ico{ display:inline-block; margin-right:.45em; font-size:1.15em; line-height:1; }
  .mode-ico img.emoji{ width:1.3em; height:1.3em; vertical-align:-0.3em; margin:0; }
  img.emoji{ display:inline-block; width:1.15em; height:1.15em; vertical-align:-0.2em; margin:0 .04em; }
  .head-right{ display:flex; align-items:center; gap:12px; }
  .lang-switch{ display:inline-flex; padding:3px; gap:2px; background: var(--bg-soft); border-radius:999px; }
  .lang-btn{
    border:none; background:transparent; padding:7px 13px; border-radius:999px;
    font-size:12.5px; letter-spacing:.04em; color: var(--ink-soft);
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  .lang-btn:hover{ color: var(--ink); }
  .lang-btn.is-active{ background: var(--ink); color:#fff; }
  .lang-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (max-width:520px){
    .head-right{ gap:6px; }
    .lang-btn{ padding:7px 9px; font-size:12px; }
      header .logo{ font-size:17px; padding:10px 0; }
  }
  @media (max-width:360px){
    header .logo{ font-size:15px; }
      .lang-btn{ padding:6px 7px; }
  }
  main{ padding-bottom: 90px; }
  section{ padding: 56px 0; }
  section + section{ border-top: 1px solid var(--line); }
  .section-head{ margin-bottom: 26px; }
  .section-head .eyebrow{ font-size: 12.5px; color: var(--ink-faint); letter-spacing:.03em; margin-bottom: 8px; }
  .section-head h2{ font-size: 26px; }

  /* ---------- mode toggle ---------- */
  .mode-toggle{
    display:inline-flex; flex-wrap:wrap; row-gap:6px; padding:4px; gap:4px;
    background: transparent; border: 1px solid var(--line-strong); border-radius: 999px;
  }
  .mode-btn{
    border:none; background:transparent; padding:10px 20px; border-radius:999px;
    font-size:13.5px; color: var(--ink-soft); white-space:nowrap;
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  .mode-btn:hover{ color: var(--ink); }
  .lbl-short{ display:none; }
  .mode-btn.is-active{ background: var(--ink); color:#fff; }

  /* ---------- roulette ---------- */
  .generator-layout{
    display:flex; align-items:center; gap:48px; margin-top:32px; flex-wrap:wrap;
  }
  @media (max-width: 760px){ .generator-layout{ flex-direction:column; gap:30px; } }

  .roulette-card{
    position:relative;
    flex:1 1 100%; width:100%; min-width:0;
    background: linear-gradient(165deg, #FFFFFF 0%, #F3F8FB 100%);
    border: 1px solid var(--line); border-radius: var(--radius-l);
    overflow:hidden;
    box-shadow: 0 20px 46px rgba(22,34,46,.06);
  }
  .roulette-row{
    position:relative;
    display:flex; align-items:center; justify-content:center; text-align:center;
    box-sizing:border-box;
    padding: 24px 30px;
    font-family:var(--font-serif); font-size: 26px; line-height:1.32;
  }
  .roulette-row + .roulette-row{ border-top: 1px solid var(--line); }
  .roulette-row.is-edge{
    color: var(--ink-faint); font-weight:400;
    transition: color .2s var(--ease);
  }
  .roulette-row.is-current{
    color: var(--ink); font-weight:560;
    padding: 32px 28px;
    transition: color .2s var(--ease), opacity .18s var(--ease);
  }
  .roulette-row.is-current.is-spinning{ color: var(--ink-soft); }
  @media (max-width: 640px){
    .roulette-row{ font-size:18.5px; padding:16px 18px; }
    .roulette-row.is-current{ padding:22px 18px; }
  }
  @keyframes rouletteLand{
    0%{ transform: scale(.97); }
    55%{ transform: scale(1.015); }
    100%{ transform: scale(1); }
  }
  .roulette-row.is-current.is-landed{ animation: rouletteLand .5s var(--ease); }


  /* ---------- слова: уровни и карточка с описанием ---------- */
  .level-row[hidden], .word-card[hidden], .mode-btn[hidden]{ display:none !important; }
  .level-row{ display:flex; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap; }
  .level-label{ font-size:12.5px; color: var(--ink-faint); letter-spacing:.02em; }
  .level-picker{ display:inline-flex; gap:2px; padding:3px; background: transparent; border: 1px solid var(--line-strong); border-radius:999px; }
  .level-chip{
    border:none; background:transparent; padding:6px 14px; border-radius:999px;
    font-size:12.5px; color: var(--ink-soft); letter-spacing:.03em;
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  .level-chip:hover{ color: var(--ink); }
  .level-chip.is-selected{ background: var(--ink); color:#fff; }
  .level-picker .level-chip.is-selected, .level-picker .level-chip.is-selected:hover{ background: transparent; color:#fff; }

  .word-card{
    display:flex; gap:18px; align-items:flex-start;
    margin-top:18px; padding:24px 26px;
    background: linear-gradient(165deg, #FFFFFF 0%, #F3F8FB 100%);
    border: 1px solid var(--line); border-radius: var(--radius-l);
    box-shadow: 0 20px 46px rgba(22,34,46,.06);
    transition: opacity .3s var(--ease);
  }
  .word-card.is-dim{ opacity:.3; }
  .word-card.is-new{ animation: wordIn .6s var(--ease); }
  @keyframes wordIn{ 0%{ opacity:0; transform: translateY(12px); } 100%{ opacity:1; transform:none; } }
  .word-ico{
    flex:0 0 auto; width:50px; height:50px; border-radius:15px;
    background: var(--accent-soft); display:grid; place-items:center; font-size:26px; line-height:1;
  }
  .word-body{ min-width:0; }
  .word-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .word-title{ font-family: var(--font-serif); font-size:28px; font-weight:560; line-height:1.15; color: var(--ink); }
  .word-level{ font-size:11.5px; letter-spacing:.06em; padding:4px 10px; border-radius:999px; background: var(--ink); color:#fff; }
  .word-def{ margin:0 0 16px; font-family: var(--font-serif); font-size:16.5px; line-height:1.55; color: var(--ink); }
  .word-ex{ margin:0; padding-left:14px; border-left:2px solid var(--accent); }
  .word-ex-label{ display:block; font-size:12px; letter-spacing:.04em; color: var(--ink-faint); margin-bottom:3px; }
  .word-ex-text{ font-family: var(--font-serif); font-size:16.5px; line-height:1.5; color: var(--ink-soft); }
  @media (max-width: 640px){
    .level-chip{ padding:6px 10px; }
    .word-card{ padding:18px; gap:14px; }
    .word-ico{ width:40px; height:40px; font-size:21px; border-radius:12px; }
    .word-title{ font-size:23px; }
    .word-def, .word-ex-text{ font-size:15.5px; }
  }


  /* ---------- переход на платный ресурс ---------- */
  .paid-cta[hidden]{ display:none !important; }
  .paid-cta{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    margin-top:24px; padding:16px 24px; border-color: var(--line-strong); color: var(--ink);
  }
  .paid-text{ min-width:0; }
  .paid-title{ margin:0 0 3px; font-family: var(--font-serif); font-size:20px; font-weight:560; line-height:1.2; color: var(--ink); }
  .paid-sub{ margin:0; font-family: var(--font-serif); font-size:14.5px; line-height:1.45; color: var(--ink-soft); }
  .paid-btn{ flex:0 0 auto; white-space:nowrap; text-decoration:none; }
  .paid-cta .paid-btn{ padding:10px 24px; }
  header .paid-btn{ padding:9px 20px; font-size:14px; min-height:0; }
  header .paid-btn[hidden]{ display:none !important; }
  @media (max-width: 640px){
    .paid-cta{ flex-direction:column; align-items:stretch; gap:12px; padding:14px 16px; text-align:left; }
    .paid-title{ font-size:18px; }
    .paid-sub{ font-size:14px; }
    header .paid-btn{ padding:8px 12px; font-size:12.5px; }
    header .logo{ font-size:17px; }
    .paid-cta .paid-btn{ width:100%; text-align:center; }
  }


  /* ---------- выбор категории (овальный выпадающий список) ---------- */
  .cat-row[hidden], .cat-menu[hidden]{ display:none !important; }
  .cat-row{ margin-top:14px; }
  .cat-dd{ position:relative; display:inline-block; max-width:100%; }
  .cat-btn{
    display:inline-flex; align-items:center; gap:8px; max-width:100%;
    padding:6px 14px; border-radius:999px; background:transparent;
    border:1px solid var(--line-strong); color: var(--ink-soft); font-size:14px; font-family: var(--font-serif);
    transition: border-color .25s var(--ease), color .25s var(--ease);
  }
  .cat-btn:hover, .cat-btn[aria-expanded="true"]{ color: var(--ink); border-color: var(--ink-faint); }
  .cat-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .cat-chev{ width:7px; height:7px; margin:-3px 0 0 4px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(45deg); transition: transform .25s var(--ease); }
  .cat-btn[aria-expanded="true"] .cat-chev{ transform:rotate(-135deg); margin-top:3px; }
  .cat-menu{
    position:absolute; top:calc(100% + 8px); left:0; z-index:40; margin:0; padding:6px; list-style:none;
    min-width:250px; max-width:calc(100vw - 40px); max-height:340px; overflow-y:auto;
    background: rgba(247,250,252,.86); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border:1px solid var(--line-strong); border-radius:22px; box-shadow: 0 18px 40px rgba(22,34,46,.14);
    animation: ddIn .22s var(--ease);
  }
  @keyframes ddIn{ from{ opacity:0; transform: translateY(-6px); } to{ opacity:1; transform:none; } }
  .cat-menu li{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:16px; font-size:14.5px; font-family: var(--font-serif); color: var(--ink); cursor:pointer; }
  .cat-menu li:hover{ background: var(--accent-soft); }
  .cat-menu li[aria-selected="true"]{ background: var(--accent); color:#fff; }

  /* бар режимов, выпадающий список категорий и уровни: по центру */
  .level-row{ justify-content:center; }
  @media (min-width: 641px){
    .mode-toggle{ display:flex; width:fit-content; max-width:100%; margin-left:auto; margin-right:auto; }
  }
  .generator-actions{ display:flex; gap:14px; margin-top:34px; flex-wrap:wrap; }

  /* ---------- timer ---------- */
  .timer-card{
    margin-top: 24px;
    display:flex; align-items:center; gap:30px; flex-wrap:wrap; justify-content:space-between;
  }
  .timer-left{ display:flex; flex-direction:column; gap:14px; flex:1; min-width:220px; }
  .timer-eyebrow{ font-size:12.5px; color: var(--ink-faint); letter-spacing:.02em; }
  .timer-duration-picker{ display:flex; gap:8px; flex-wrap:wrap; }
  .timer-chip{
    font-size:13px; color: var(--ink-soft); background: var(--bg-soft);
    border:1px solid transparent; padding:8px 15px; border-radius:20px; cursor:pointer;
    transition: background .2s var(--ease), color .2s var(--ease);
  }
  .timer-chip:hover{ background: var(--accent-soft); color: var(--accent); }
  .timer-chip.is-selected{ background: var(--ink); color:#fff; }
  .timer-controls{ display:flex; gap:12px; }

  .timer-ring-wrap{ display:grid; place-items:center; width:132px; height:132px; flex-shrink:0; }
  .timer-ring-wrap > *{ grid-area: 1 / 1; }
  .timer-ring-svg circle{ fill:none; }
  .timer-ring-track{ stroke: var(--bg-soft); }
  .timer-ring-progress{ stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .3s; }
  .timer-ring-wrap.is-done .timer-ring-progress{ stroke: var(--good); }
  .timer-value{ font-family:var(--font-serif); font-size:22px; font-variant-numeric: tabular-nums; }
  .timer-ring-wrap.is-done .timer-value{ font-size:15px; color: var(--good); }


  /* ---------- mobile bottom nav (5 tabs: icon + label, same on every page) ---------- */
  .mobile-nav{
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:80;
    background: rgba(255,255,255,.95); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top:1px solid var(--line);
    padding: 4px max(4px, env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
  }
  @media (max-width: 860px){ .mobile-nav{ display:flex; } main{ padding-bottom: calc(92px + env(safe-area-inset-bottom)); } }
  .mobile-nav a{
    flex:1 1 0; min-width:0; min-height:54px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;

    spinning: false,
    timer: { duration: 300, remaining: 300, running: false, handle: null },
  };

  /* ---------- topic data ---------- */

  async function loadTopics(){
    try {
      const res = await fetch(TOPICS_URL);
      if (!res.ok) throw new Error('topics_fetch_failed');
      state.all = await res.json();
    } catch (e) {
      state.all = {};     // темы недоступны, но слова работают без JSON
    }
    buildPools();
  }
  function buildPools(){
    const base = state.all[state.lang] || state.all.ru || {};
    state.pools = Object.assign({}, base);   // слова приходят из topics.json (en.words), пока только английские
  }
  // Пул текущего режима; в режиме слов учитывает выбранный уровень
  function getPool(mode){
    mode = mode || state.mode;
    const pool = state.pools[mode];
    if (mode === 'words' && state.level !== 'all') return (pool || []).filter((w) => w.level === state.level);
    if (mode === 'random'){
      const cats = state.pools.cats || {};
      if (state.cat === 'all') return (pool || []).concat.apply([], Object.keys(cats).map((k) => cats[k]));
      return cats[state.cat] || [];
    }
    return pool;
  }

  /* ---------- sound (synthesised, no audio files needed) ---------- */
  // Мягкий «маримба/колокольчик»: чистые синусы, быстрая атака без щелчка,
  // длинное затухание, всё через фильтр и лёгкое эхо. Ноты — из пентатоники,
  // поэтому любая последовательность звучит созвучно.

  let audioCtx = null, bus = null;
  const SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50]; // до-ре-ми-соль-ля-до

  function getAudioCtx(){
    try {
      if (!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const master = audioCtx.createGain();
        master.gain.value = 0.9;
        const tone = audioCtx.createBiquadFilter();
        tone.type = 'lowpass'; tone.frequency.value = 3200; tone.Q.value = 0.3;
        // тихое эхо — «воздух» вокруг звука
        const echo = audioCtx.createDelay(0.6); echo.delayTime.value = 0.22;
        const fb = audioCtx.createGain(); fb.gain.value = 0.28;
        const wet = audioCtx.createGain(); wet.gain.value = 0.32;
        const damp = audioCtx.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 1800;
        tone.connect(master);
        tone.connect(echo); echo.connect(damp); damp.connect(fb); fb.connect(echo);
        damp.connect(wet); wet.connect(master);
        master.connect(audioCtx.destination);
        bus = tone;
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }

  // одна мягкая нота: основной тон + тихий обертон на октаву выше
  function playNote(freq, opts){
    const ctx = getAudioCtx();
    if (!ctx || !bus) return;
    opts = opts || {};
    const t0 = ctx.currentTime + (opts.when || 0);
    const dur = opts.dur || 0.5;
    const peak = opts.gain || 0.05;
    try {
      [[1, 1], [2, 0.18]].forEach(([mult, amp]) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq * mult;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(peak * amp, t0 + (opts.attack || 0.012));
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + (mult === 1 ? dur : dur * 0.45));
        osc.connect(g); g.connect(bus);
        osc.start(t0);
        osc.stop(t0 + dur + 0.05);
      });
    } catch (e) { /* audio unavailable -- fail silently */ }
  }

  // Звук вращения — файл sound.mp3 (4,5 с, тихий, поэтому усиливаем).
  // Декодируем заранее; если не вышло, играем обычным <audio>.
  const SPIN_URL = 'sound.mp3';
  const SPIN_GAIN = 3;
  // Моменты сильных щелчков в sound.mp3, секунды от начала. Интервалы только растут: барабан замедляется
  const SPIN_BEATS = [0.054, 0.137, 0.226, 0.316, 0.411, 0.512, 0.611, 0.709, 0.811, 0.916, 1.028, 1.141, 1.256, 1.376, 1.499, 1.63, 1.763, 1.905, 2.05, 2.206, 2.374, 2.547, 2.739, 2.946, 3.188, 3.478, 3.968];
  let spinBuffer = null, spinAudio = null, spinSrc = null;
  function loadSpinSound(){
    try {
      spinAudio = new Audio(SPIN_URL);
      spinAudio.preload = 'auto';
      const ctx = getAudioCtx();
      if (!ctx) return;
      fetch(SPIN_URL).then(r => r.arrayBuffer()).then(buf => ctx.decodeAudioData(buf))
        .then(b => { spinBuffer = b; }).catch(() => {});
    } catch (e) {}
  }
  function playSpinSound(){
    try {
      stopSpinSound();
      const ctx = getAudioCtx();
      if (ctx && spinBuffer){
        const src = ctx.createBufferSource();
        const g = ctx.createGain();
        src.buffer = spinBuffer;
        g.gain.value = SPIN_GAIN;
        src.connect(g); g.connect(ctx.destination);
        src.start();
        spinSrc = { src, g };
      } else if (spinAudio){
        spinAudio.currentTime = 0;
        spinAudio.volume = 1;
        spinAudio.play().catch(() => {});
      }
    } catch (e) {}
  }
  function stopSpinSound(){
    try {
      if (spinSrc){ spinSrc.src.stop(); spinSrc = null; }
      if (spinAudio) spinAudio.pause();
    } catch (e) {}
  }
  function playLandChime(){
    // ласковый мажорный аккорд, ноты вступают одна за другой
    [523.25, 659.25, 783.99].forEach((f, i) => playNote(f, { when: i * 0.075, dur: 1.4, gain: 0.05, attack: 0.02 }));
  }
  function playTimerTick(){ playNote(440, { dur: 0.18, gain: 0.025, attack: 0.01 }); }
  function playTimerDone(){
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => playNote(f, { when: i * 0.14, dur: 1.6, gain: 0.05, attack: 0.02 }));
  }

  /* ---------- слова: карточка и уровни ---------- */

  function renderWordCard(word, opts){
    opts = opts || {};
    wordCard.classList.remove('is-dim');
    if (state.mode !== 'words' || !word || !word.def){ wordCard.hidden = true; return; }
    wordTitle.textContent = word.text;
    wordLevel.textContent = word.level;
    wordDef.textContent = word.def;
    wordEx.textContent = word.example;
    wordCard.hidden = false;
    if (opts.animate && !reduceMotion){
      wordCard.classList.remove('is-new');
      void wordCard.offsetWidth;   // перезапуск CSS-анимации
      wordCard.classList.add('is-new');
    }
  }

  function buildLevelChips(){
    const list = (state.all.en && state.all.en.words) || [];
    const present = Array.from(new Set(list.map((w) => w.level)))
      .sort((a, b) => LEVEL_ORDER.indexOf(a) - LEVEL_ORDER.indexOf(b));
    const make = (level, label, i18n) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'level-chip' + (level === state.level ? ' is-selected' : '');
      b.dataset.level = level;
      if (i18n) b.dataset.i18n = i18n;
      b.textContent = label;
      b.addEventListener('click', () => setLevel(level));
      levelPicker.appendChild(b);
    };
    make('all', t('all'), 'all');
    present.forEach((lv) => make(lv, lv));
  }

  function setLevel(level){
    if (state.spinning || level === state.level) return;
    state.level = level;
    levelPicker.querySelectorAll('.level-chip').forEach((b) => b.classList.toggle('is-selected', b.dataset.level === level));
    state.current = pickRandomTopic(getPool());
    renderRoulette(state.current, { landed: true });
    renderWordCard(state.current, { animate: true });
  }

  /* ---------- переход на платный ресурс + цели Яндекс Метрики ---------- */

  // Отправка цели в Метрику; callback вызывается после отправки (или через 0,5 с, если Метрика недоступна)
  function ymGoal(name, params, cb){
    let done = false;
    const finish = () => { if (!done){ done = true; if (cb) cb(); } };
    try {
      if (typeof YM_ID !== 'undefined' && YM_ID && typeof ym === 'function'){
        ym(YM_ID, 'reachGoal', name, params || {}, finish);
        setTimeout(finish, 500);
        return;
      }
    } catch (e) { /* аналитика не должна ломать страницу */ }
    finish();
  }

  function paidHref(){
    try {
      const u = new URL(PAID_URL, location.href);
      Object.keys(PAID_UTM).forEach((k) => { if (!u.searchParams.has(k)) u.searchParams.set(k, PAID_UTM[k]); });
      u.searchParams.set('utm_content', state.lang + '_' + state.mode);
      return u.toString();
    } catch (e) { return PAID_URL; }
  }

  function setupPaidCta(){
    if (!PAID_URL){ paidCta.hidden = true; paidLinkTop.hidden = true; return; }
    paidCta.hidden = false; paidLinkTop.hidden = false;

    // Две кнопки (в блоке и в шапке) ведут на одну ссылку; в цель добавляется source, чтобы видеть, какая сработала
    [[paidLink, 'block'], [paidLinkTop, 'header']].forEach(([a, source]) => {
      a.href = paidHref();
      a.addEventListener('click', (e) => {
        const params = { lang: state.lang, mode: state.mode, source: source };
        a.href = paidHref();
        const plain = e.button === 0 && !(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey);
        if (!plain){ ymGoal('paid_click', params); return; }   // «в новой вкладке» и т.п.: страница остаётся, просто шлём цель
        e.preventDefault();
        ymGoal('paid_click', params, () => { location.href = a.href; });
      });
    });

    // Показ блока: нужен, чтобы считать долю тех, кто нажал (кликов / показов)
    if ('IntersectionObserver' in window){
      const io = new IntersectionObserver((entries) => {
        if (entries.some((en) => en.isIntersecting)){
          io.disconnect();
          ymGoal('paid_view', { lang: state.lang });
        }
      }, { threshold: 0.6 });
      io.observe(paidCta);
    }
  }

  /* ---------- категории случайных тем ---------- */
  const CATS = [
    { k: 'all', e: '🎲' }, { k: 'money', e: '💰' }, { k: 'nutrition', e: '🥗' }, { k: 'interview', e: '💼' },
    { k: 'pitch', e: '💸' }, { k: 'defend', e: '⚖️' }, { k: 'eli5', e: '👶' }, { k: 'hottakes', e: '🔥' },
    { k: 'business', e: '🚀' }, { k: 'tech', e: '🤖' }, { k: 'fitness', e: '💪' }, { k: 'productivity', e: '⚡' },
    { k: 'history', e: '📜' }, { k: 'literature', e: '📚' }, { k: 'everyday', e: '🏠' },
  ];
  function buildCatMenu(){
    CATS.forEach((c) => {
      const li = document.createElement('li');
      li.setAttribute('role', 'option'); li.dataset.k = c.k;
      li.addEventListener('click', () => setCat(c.k));
      catMenu.appendChild(li);
    });
  }
  function updateCatUi(){
    const cur = CATS.find((c) => c.k === state.cat) || CATS[0];
    catIco.textContent = cur.e; catLabel.textContent = t('cat_' + cur.k);
    catMenu.setAttribute('aria-label', t('catLabel'));
    catMenu.querySelectorAll('li').forEach((li) => {
      const c = CATS.find((x) => x.k === li.dataset.k);
      li.textContent = c.e + ' ' + t('cat_' + c.k);
      li.setAttribute('aria-selected', c.k === state.cat ? 'true' : 'false');
    });
  }
  function closeCat(){ catMenu.hidden = true; catBtn.setAttribute('aria-expanded', 'false'); }
  function setCat(k){
    closeCat();
    if (state.spinning || k === state.cat) return;
    state.cat = k;
    updateCatUi();
    state.current = pickRandomTopic(getPool());
    renderRoulette(state.current, { landed: true });
  }
  catBtn.addEventListener('click', () => {
    const open = catMenu.hidden;
    if (open && state.spinning) return;
    catMenu.hidden = !open; catBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', (e) => { if (!catRow.contains(e.target)) closeCat(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCat(); });

  /* ---------- roulette ---------- */

  function pickRandomTopic(pool, avoidId){
    if (!pool || pool.length === 0) return null;
    if (pool.length === 1) return pool[0];
    let topic;
    do { topic = pool[Math.floor(Math.random() * pool.length)]; } while (topic.id === avoidId);
    return topic;
  }

  function renderRoulette(topic, opts){
    opts = opts || {};
    if (!topic){
      rouletteCurrent.textContent = '—';
      rouletteEdgeTop.textContent = '—';
      rouletteEdgeBottom.textContent = '—';
      return;
    }
    const pool = getPool();
    const edgeTop = pickRandomTopic(pool, topic.id);
    let edgeBottom = pickRandomTopic(pool, topic.id);
    // при коротком списке (слова) верх и низ не должны совпадать
    if (pool && pool.length > 2 && edgeTop){
      let guard = 0;
      while (edgeBottom.id === edgeTop.id && guard++ < 10) edgeBottom = pickRandomTopic(pool, topic.id);
    }
    rouletteCurrent.textContent = topic.text;
    rouletteEdgeTop.textContent = edgeTop ? edgeTop.text : '—';
    rouletteEdgeBottom.textContent = edgeBottom ? edgeBottom.text : '—';
    if (opts.landed){
      rouletteCurrent.classList.remove('is-landed');
      // eslint-disable-next-line no-unused-expressions
      void rouletteCurrent.offsetWidth; // restart the CSS animation
      rouletteCurrent.classList.add('is-landed');
    }
  }

  function setMode(mode, opts){
    opts = opts || {};
    state.mode = mode;
    modeButtons.forEach((btn) => {
      const active = btn.dataset.mode === mode;
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    if (!opts.silent){
      state.current = pickRandomTopic(getPool(mode));
      renderRoulette(state.current);
    }
    levelRow.hidden = mode !== 'words';
    catRow.hidden = mode !== 'random';
    closeCat();
    renderWordCard(state.current);
  }
  modeButtons.forEach((btn) => {
    btn.addEventListener('click', () => { if (!state.spinning) setMode(btn.dataset.mode); });
  });

  function spin(){
    if (state.spinning) return;
    const pool = getPool();
    if (!pool || pool.length === 0) return;
    state.spinning = true;
    wordCard.classList.add('is-dim');
    spinBtn.disabled = true;
    playSpinSound();
    rouletteCurrent.classList.remove('is-landed');
    rouletteCurrent.classList.add('is-spinning');

    const target = pickRandomTopic(pool, state.current ? state.current.id : null);

    function land(){
      renderRoulette(target);
      playLandChime();
      state.current = target;
      rouletteCurrent.classList.remove('is-spinning');
      renderRoulette(target, { landed: true });
      renderWordCard(target, { animate: true });
      state.spinning = false;
      spinBtn.disabled = false;
    }

    if (reduceMotion){ land(); return; }

    // Каждый щелчок в звуке = смена темы. Время щелчков измерено по sound.mp3,
    // последний щелчок = остановка на выбранной теме.
    const t0 = performance.now();
    const lag = (audioCtx && (audioCtx.outputLatency || audioCtx.baseLatency) || 0) * 1000;
    let i = 0, last = null;
    function frame(now){
      const elapsed = (now - t0 - lag) / 1000;
      let due = -1;
      while (i < SPIN_BEATS.length && SPIN_BEATS[i] <= elapsed){ due = i; i += 1; }
      if (i >= SPIN_BEATS.length && due >= 0){ land(); return; }
      if (due >= 0){
        let shown; do { shown = pickRandomTopic(pool); } while (last && shown.id === last && pool.length > 1);
        last = shown.id;
        renderRoulette(shown);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  spinBtn.addEventListener('click', spin);

  /* ---------- timer ---------- */

  function formatTime(totalSeconds){
    const mm = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
    const ss = String(totalSeconds % 60).padStart(2, '0');
    return `${mm}:${ss}`;
  }
  function renderTimer(){
    timerValue.textContent = formatTime(state.timer.remaining);
    const frac = state.timer.duration > 0 ? state.timer.remaining / state.timer.duration : 0;
    timerRingProgress.style.strokeDashoffset = String(RING_CIRC * (1 - frac));
  }
  function stopTimerInterval(){
    if (state.timer.handle) clearInterval(state.timer.handle);
    state.timer.handle = null;
  }
  function startTimer(){
    if (state.timer.remaining <= 0) state.timer.remaining = state.timer.duration;
    state.timer.running = true;
    timerRingWrap.classList.remove('is-done');
    state.ui.start = 'pause'; state.ui.done = false;
    timerStartBtn.textContent = t('pause');
    stopTimerInterval();
    state.timer.handle = setInterval(() => {
      state.timer.remaining -= 1;
      if (state.timer.remaining <= 0){
        state.timer.remaining = 0;
        renderTimer();
        stopTimerInterval();
        state.timer.running = false;
        state.ui.start = 'start'; state.ui.done = true;
        timerStartBtn.textContent = t('start');
        timerRingWrap.classList.add('is-done');
        timerValue.textContent = t('done');
        playTimerDone();
        return;
      }
      if (state.timer.remaining <= 5) playTimerTick();
      renderTimer();
    }, 1000);
    renderTimer();
  }
  function pauseTimer(){
    stopTimerInterval();
    state.timer.running = false;
    state.ui.start = 'resume';
    timerStartBtn.textContent = t('resume');
  }
  function resetTimer(){
    stopTimerInterval();
    state.timer.running = false;
    state.timer.remaining = state.timer.duration;
    state.ui.start = 'start'; state.ui.done = false;
    timerStartBtn.textContent = t('start');
    timerRingWrap.classList.remove('is-done');
    renderTimer();
  }

  timerToggleBtn.addEventListener('click', () => {
    const willShow = timerCard.classList.contains('hidden');
    timerCard.classList.toggle('hidden');
    state.ui.toggle = willShow ? 'timerHide' : 'timerShow';
    timerToggleBtn.textContent = t(state.ui.toggle);
    if (willShow && !reduceMotion && hasGsap){
      gsap.fromTo(timerCard, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .5, ease: 'power3.out' });
    }
  });
  timerChips.forEach((chip) => {
    chip.addEventListener('click', () => {
      if (state.timer.running) return;
      timerChips.forEach((c) => c.classList.remove('is-selected'));
      chip.classList.add('is-selected');
      const seconds = parseInt(chip.dataset.seconds, 10);
      state.timer.duration = seconds;
      state.timer.remaining = seconds;
      state.ui.done = false;
      timerRingWrap.classList.remove('is-done');
      renderTimer();
    });
  });
  timerStartBtn.addEventListener('click', () => {
    if (state.timer.running) pauseTimer(); else startTimer();
  });
  timerResetBtn.addEventListener('click', resetTimer);

  /* ---------- language ---------- */

  const langButtons = Array.from(document.querySelectorAll('.lang-btn'));
  function applyLang(){
    document.documentElement.lang = state.lang;
    document.title = t('title');
    const md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute('content', t('desc'));
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    langButtons.forEach((b) => {
      const on = b.dataset.lang === state.lang;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    updateCatUi();
    wordsModeBtn.hidden = state.lang !== 'en';   // слова пока только для английской версии
    timerToggleBtn.textContent = t(state.ui.toggle);
    timerStartBtn.textContent = t(state.ui.start);
    if (state.ui.done) timerValue.textContent = t('done'); else renderTimer();
  }

  function setLang(lang){
    if (lang === state.lang || state.spinning) return;
    state.lang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* private mode */ }
    const prevId = state.current ? state.current.id : null;
    buildPools();
    if (state.mode === 'words' && lang !== 'en') setMode('random', { silent: true });
    const pool = getPool();
    // тема остаётся той же, меняется только язык
    state.current = (pool && pool.find((x) => x.id === prevId)) || pickRandomTopic(pool);
    applyLang();
    renderRoulette(state.current, { landed: true });
  }
  langButtons.forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));

  /* ---------- reveal + nav highlight ---------- */

  function setupRevealAnimations(){
    if (reduceMotion || !hasGsap){
      document.querySelectorAll('.reveal').forEach(el => { el.style.opacity = 1; el.style.transform = 'none'; });
      return;
    }
    document.querySelectorAll('.reveal').forEach((el) => {
      gsap.to(el, {
        opacity: 1, y: 0, duration: 0.9, ease: 'power3.out',
        scrollTrigger: { trigger: el, start: 'top 92%' },
      });
    });
  }

  async function init(){
    // Страница должна открываться даже без topics.json: тогда в барабане прочерки.
    try {
      loadSpinSound();
      await loadTopics();
      buildCatMenu();
      buildLevelChips();   // уровни берутся из слов в topics.json
      applyLang();
      setupPaidCta();
      state.current = pickRandomTopic(getPool());
      renderRoulette(state.current);
      renderWordCard(state.current);
      renderTimer();
    } catch (e) {
      console.error(e);
    }

    loadingGate.classList.add('is-hidden');
    setTimeout(() => { loadingGate.style.display = 'none'; }, 450);

    try { setupRevealAnimations(); } catch (e) { console.error(e); }
  }

  init();
})();
</script>

<script>
/* Скользящий индикатор выбора. Следит за сменой класса активного элемента,
   поэтому существующая логика страницы не меняется. */
(function(){
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function slideSelect(host, itemSel, activeCls, kind){
    if (!host) return;
    host.setAttribute('data-slide-host', '');
    var ind = document.createElement('span');
    ind.className = 'sel-indicator ' + kind;
    ind.setAttribute('aria-hidden', 'true');
    var first = true;

    function ensure(){ if (ind.parentNode !== host) host.appendChild(ind); }

    function place(animate){
      ensure();
      var el = host.querySelector(itemSel + '.' + activeCls);
      if (!el || !el.offsetWidth){ ind.classList.remove('is-ready'); return; }
      var noAnim = !animate || first || reduce;
      if (noAnim) ind.classList.add('no-anim');
      ind.style.width = el.offsetWidth + 'px';
      ind.style.height = el.offsetHeight + 'px';
      ind.style.borderRadius = getComputedStyle(el).borderRadius;
      ind.style.transform = 'translate(' + el.offsetLeft + 'px,' + el.offsetTop + 'px)';
      ind.classList.add('is-ready');
      if (noAnim){ void ind.offsetWidth; ind.classList.remove('no-anim'); }
      first = false;
    }

    var mo = new MutationObserver(function(list){
      // изменения самого индикатора игнорируем, иначе цикл
      list = list.filter(function(r){
        if (r.target === ind) return false;
        if (r.type === 'childList') {
          var only = Array.prototype.every.call(r.addedNodes, function(n){ return n === ind; }) &&
                     Array.prototype.every.call(r.removedNodes, function(n){ return n === ind; });
          return !only;
        }
        return true;
      });
      if (!list.length) return;
      // перерисовка содержимого (innerHTML) — ставим без анимации
      if (list.some(function(r){ return r.type === 'childList'; })) first = true;
      place(true);
    });
    mo.observe(host, { attributes:true, attributeFilter:['class'], subtree:true, childList:true });

    if (window.ResizeObserver) new ResizeObserver(function(){ place(false); }).observe(host);
    window.addEventListener('resize', function(){ place(false); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ place(false); });
    place(false);
  }

  window.slideSelect = slideSelect;
  
  slideSelect(document.getElementById('modeToggle'), '.mode-btn', 'is-active', 'is-fill-accent');
  slideSelect(document.getElementById('levelPicker'), '.level-chip', 'is-selected', 'is-fill-accent');
  slideSelect(document.querySelector('.timer-duration-picker'), '.timer-chip', 'is-selected', 'is-fill-accent');

})();
</script>
<script>
/* Эмодзи-картинки из папки emoji/ (файлы вида 1f3ce.png: код строчными буквами).
   Любой эмодзи в тексте страницы, в том числе появившийся позже, заменяется на <img>.
   Нет файла — остаётся обычный символ. */
(function(){
  const PATH = 'static/emoji/', EXT = 'png';

  const unit = '(?:\\p{Emoji_Presentation}|[\\u{1F000}-\\u{1FFFD}]|\\p{Extended_Pictographic}\\uFE0F)\\uFE0F?(?:\\p{Emoji_Modifier})?';
  const RE = new RegExp(
    '\\p{Regional_Indicator}{2}|[#*0-9]\\uFE0F?\\u20E3|' + unit +
    '(?:\\u200D(?:\\p{Emoji_Presentation}|\\p{Extended_Pictographic})\\uFE0F?(?:\\p{Emoji_Modifier})?)*', 'gu');
  const SKIP = 'script,style,textarea,input,svg,[data-no-emoji],#transcriptText,img.emoji';
  const failed = new Set();   // эмодзи без файла: больше не трогаем, иначе наблюдатель зациклится

  // Имя файла: коды через дефис без fe0f (1f3ce.png). Запасные имена: с fe0f (1f3ce-fe0f.png)
  function urls(emoji){
    const cps = Array.from(emoji).map(c => c.codePointAt(0).toString(16));
    const plain = cps.filter(c => c !== 'fe0f');
    const names = [plain.join('-'), cps.join('-'), [plain[0], 'fe0f'].concat(plain.slice(1)).join('-')];
    return names.filter((n, i) => names.indexOf(n) === i).map(n => PATH + n + '.' + EXT);
  }

  function makeImg(emoji){
    const img = document.createElement('img');
    const list = urls(emoji);
    let i = 0;
    img.className = 'emoji';
    img.alt = emoji;
    img.draggable = false;
    img.src = list[0];
    img.onerror = () => {
      if (++i < list.length) { img.src = list[i]; return; }
      if (!failed.has(emoji)) console.warn('Эмодзи не найдено, пробовали:', list);
      failed.add(emoji);
      img.replaceWith(document.createTextNode(emoji));
    };
    return img;
  }

  function convertText(node){
    const text = node.nodeValue;
    RE.lastIndex = 0;
    const found = text.match(RE);
    if (!found || found.every(e => failed.has(e))) return;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    RE.lastIndex = 0;
    while ((m = RE.exec(text))){
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      frag.appendChild(failed.has(m[0]) ? document.createTextNode(m[0]) : makeImg(m[0]));
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.replaceWith(frag);
  }

  function convert(root){
    if (root.nodeType === 3){
      if (!root.parentElement || !root.parentElement.closest(SKIP)) convertText(root);
      return;
    }
    if (root.nodeType !== 1 || root.closest(SKIP)) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => n.parentElement && n.parentElement.closest(SKIP) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(convertText);
  }

  window.renderEmoji = convert;   // вручную: renderEmoji(элемент)
  convert(document.body);

  let queue = new Set(), scheduled = false;
  new MutationObserver(muts => {
    muts.forEach(mu => {
      if (mu.type === 'characterData') queue.add(mu.target);
      else mu.addedNodes.forEach(n => queue.add(n));
    });
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      const items = Array.from(queue); queue = new Set();
      items.forEach(n => { if (n.isConnected) convert(n); });
    });
  }).observe(document.body, { childList:true, subtree:true, characterData:true });
})();
</script>
